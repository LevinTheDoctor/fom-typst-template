# ==============================================================================
# CI: Kompiliert die Arbeit bei jedem Push/PR, committet das fertige
# thesis.pdf zurück auf den Branch und stellt es zusätzlich als Artefakt
# bereit. Bricht bei Fehlern UND Warnungen ab. Die Wortzahl des Textteils
# (Marke <word-count> über wordometer) landet in der Lauf-Übersicht.
# ==============================================================================
name: PDF bauen

on:
  push:
    branches: [main, webapp, example-seminararbeit]
    # Änderungen nur am committeten PDF lösen keinen neuen Lauf aus.
    paths-ignore: ["thesis.pdf"]
  pull_request:
  workflow_dispatch:

# Nötig, damit der Workflow das gebaute PDF zurückpushen darf.
permissions:
  contents: write

jobs:
  typst:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Typst installieren
        uses: typst-community/setup-typst@v4

      # Times New Roman (ms-corefonts) für originalgetreue Ausgabe; die im
      # Repository liegende Liberation Serif dient sonst als Fallback.
      - name: Times New Roman installieren
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer fontconfig
          sudo fc-cache -f

      - name: Kompilieren (Warnungen gelten als Fehler)
        run: make check

      # Wortzahl des Textteils in die Lauf-Übersicht schreiben. Fehlt die
      # Marke <word-count> (z. B. weil wordometer nicht eingebunden ist),
      # wird das nur vermerkt – kein CI-Fehler.
      - name: Wortzahl bestimmen
        run: |
          anzahl=$(typst query --font-path fonts main.typ "<word-count>" --field value --one 2>/dev/null)
          if [ -n "$anzahl" ]; then
            echo "### Wortzahl (Textteil): **$anzahl Wörter**" >> "$GITHUB_STEP_SUMMARY"
            echo "Wortzahl (Textteil): $anzahl"
          else
            echo "### Wortzahl: keine Marke <word-count> gefunden" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Bei Pushes (nicht bei PRs) landet das fertige PDF direkt im Repository,
      # sodass auf jedem Branch immer ein aktuelles thesis.pdf liegt.
      - name: PDF im Repository ablegen
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f thesis.pdf
          if git diff --cached --quiet; then
            echo "thesis.pdf unverändert – kein Commit nötig."
          else
            git commit -m "CI: thesis.pdf aktualisieren [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: PDF als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: thesis.pdf
